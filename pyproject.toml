[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "robinion_gym"
version = "0.1.0"
description = "Isaac Lab environments for robinion_gym."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Isaac Lab Project Developers" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab-dev[rsl-rl]",
]

[project.entry-points."isaaclab.tasks"]
"robinion_gym" = "robinion_gym.tasks"

[project.optional-dependencies]
isaacsim = ["isaaclab-dev[isaacsim]"]
video = ["isaaclab-dev[video]"]
ov = ["isaaclab-dev[ov]"]
ovphysx = ["isaaclab-dev[ovphysx]"]
ovrtx = ["isaaclab-dev[ovrtx]"]

[dependency-groups]
dev = ["codespell>=2.4", "pre-commit>=4.2", "pytest>=8.3", "ruff>=0.11"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
override-dependencies = [
    "decorator<5",
    "numpy>=2",
    "mujoco~=3.11.0",
    "mujoco-warp~=3.11.0",
    "newton[sim]==1.5.2",
    "newton-usd-schemas>=0.4.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "packaging>=20,<27",
]

[tool.uv.sources]
"isaaclab" = { path = "../../IsaacLab/source/isaaclab", editable = true }
"isaaclab-assets" = { path = "../../IsaacLab/source/isaaclab_assets", editable = true }
"isaaclab-contrib" = { path = "../../IsaacLab/source/isaaclab_contrib", editable = true }
"isaaclab-dev" = { path = "../../IsaacLab", editable = true }
"isaaclab-experimental" = { path = "../../IsaacLab/source/isaaclab_experimental", editable = true }
"isaaclab-mimic" = { path = "../../IsaacLab/source/isaaclab_mimic", editable = true }
"isaaclab-newton" = { path = "../../IsaacLab/source/isaaclab_newton", editable = true }
"isaaclab-ov" = { path = "../../IsaacLab/source/isaaclab_ov", editable = true }
"isaaclab-physx" = { path = "../../IsaacLab/source/isaaclab_physx", editable = true }
"isaaclab-ppisp" = { path = "../../IsaacLab/source/isaaclab_ppisp", editable = true }
"isaaclab-rl" = { path = "../../IsaacLab/source/isaaclab_rl", editable = true }
"isaaclab-tasks" = { path = "../../IsaacLab/source/isaaclab_tasks", editable = true }
"isaaclab-tasks-experimental" = { path = "../../IsaacLab/source/isaaclab_tasks_experimental", editable = true }
"isaaclab-teleop" = { path = "../../IsaacLab/source/isaaclab_teleop", editable = true }
"isaaclab-visualizers" = { path = "../../IsaacLab/source/isaaclab_visualizers", editable = true }
"omniverseclient" = { index = "pypi-public" }
"ovphysx" = { index = "pypi-public" }
"ovrtx" = { index = "pypi-public" }
"ovstage" = { index = "pypi-public" }
"torch" = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }, { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }, { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
"torchaudio" = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }, { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }, { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
"torchvision" = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }, { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }, { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]

[tool.uv.build-backend]
module-name = "robinion_gym"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["robinion_gym"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "isaaclab",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-assets",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
isaaclab = ["isaaclab", "isaaclab_newton", "isaaclab_ov", "isaaclab_physx"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-tasks" = ["isaaclab_tasks"]
"isaaclab-assets" = ["isaaclab_assets"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/__init__.pyi" = ["F401", "F403"]
"scripts/**/*.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "scripts", "tests"]
exclude = ["**/__pycache__", "**/logs", ".git", ".venv", ".vscode"]
# Make the editable Isaac Lab source packages resolvable by Pylance / basedpyright
# without relying on the editable-install finder, so re-exported terms such as
# ``mdp.base_height_l2`` resolve through ``from isaaclab.envs.mdp import *``.
extraPaths = ["../../IsaacLab/source/*"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: test exercises isolated logic and does not launch the simulator",
    "integration: test drives the simulator/scene/environment end-to-end",
    "smoke: tests for core installation, task, and RL functionality",
    "kitless: test must pass inside the Kit-less container, which has no Isaac Sim runtime",
]

[tool.codespell]
skip = "*.usd,*.usda,*.usdc,*.json,*.onnx,*.pt,*.mp4,*.data,uv.lock,logs"

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

